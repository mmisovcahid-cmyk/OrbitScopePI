server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # API -> backend container. SPHEREx downloads can take minutes on a new field;
    # the UI uses background jobs, but direct API calls (blink, GIF) may still be long.
    # Ground Node uploads: a night's image sequence can be a few hundred MB.
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (/, /detection, /embed?...) serves index.html.
    location / {
        try_files $uri /index.html;
    }
}
