# OrbitScope on a Raspberry Pi: static frontend + /api proxy to the backend on 127.0.0.1:8000.
# Installed by install.sh as /etc/nginx/sites-available/orbitscope (and made the default site).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /opt/orbitscope/www;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # SPHEREx downloads can take minutes on a new field; the UI uses background jobs,
    # but direct API calls (blink, GIF) may still be long.
    # Ground Node uploads: a night's image sequence can be a few hundred MB.
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrites anything a client sends: the backend trusts this header (TRUST_PROXY_HEADERS).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /docs { proxy_pass http://127.0.0.1:8000; proxy_set_header X-Real-IP $remote_addr; }
    location /openapi.json { proxy_pass http://127.0.0.1:8000; proxy_set_header X-Real-IP $remote_addr; }

    # Hashed build assets (and bundled fonts) can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path (/, /detection, /embed?...) serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
